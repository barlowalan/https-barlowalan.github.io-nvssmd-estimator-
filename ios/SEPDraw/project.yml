name: SEPDraw
options:
  bundleIdPrefix: com.nvssmd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/SEPDraw.entitlements
    GENERATE_INFOPLIST_FILE: false
    SUPPORTS_XR_DESIGNED_FOR_IPAD: false
targets:
  SEPDraw:
    type: application
    platform: iOS
    sources:
      - path: SEPDrawApp.swift
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvssmd.sepdraw
        PRODUCT_NAME: SEP Draw
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: SEP Draw
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: YES
    entitlements:
      path: Resources/SEPDraw.entitlements
schemes:
  SEPDraw:
    build:
      targets:
        SEPDraw: all
    run:
      config: Debug
    archive:
      config: Release
