name: SEPDesign
options:
  bundleIdPrefix: com.nvssmd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/SEPDesign.entitlements
    GENERATE_INFOPLIST_FILE: false
    SUPPORTS_XR_DESIGNED_FOR_IPAD: false
targets:
  SEPDesign:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ExportTXT/**
          - README.md
          - project.yml
          - "**/*.txt"
    resources:
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nvssmd.sepdesign
        PRODUCT_NAME: SEP Design
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: SEP Design
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    entitlements:
      path: Resources/SEPDesign.entitlements
schemes:
  SEPDesign:
    build:
      targets:
        SEPDesign: all
    run:
      config: Debug
    archive:
      config: Release
